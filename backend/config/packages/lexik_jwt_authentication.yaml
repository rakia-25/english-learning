lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    # En-tête X-Auth-Token : contourne les proxies (Vite, etc.) qui ne transmettent pas toujours Authorization
    token_extractors:
        authorization_header:
            enabled: true
            prefix: Bearer
            name: X-Auth-Token
